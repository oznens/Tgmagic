name: MEXC Futures Scan
on:
  workflow_dispatch:
  push:
    branches: ["claude/tg-channel-strategy-extract-bpXXg"]
    paths:
      - "scanner.py"
      - "config.json"
      - ".github/workflows/scan.yml"
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: mexc-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan MEXC futures
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
      - name: Save signal history
        run: |
          git config user.name "mexc-ote-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/signals.json
          git diff --cached --quiet || git commit -m "Update MEXC signals"
          git push
