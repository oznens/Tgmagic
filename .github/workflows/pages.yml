name: Deploy dashboard
# Pages enabled
# chart dashboard refresh
on:
  workflow_dispatch:
  push:
    branches: ["claude/tg-channel-strategy-extract-bpXXg"]
    paths:
      - "dashboard/**"
      - "data/**"
      - ".github/workflows/pages.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir public
          cp dashboard/index.html public/index.html
          mkdir -p public/data
          cp data/signals.json public/data/signals.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
